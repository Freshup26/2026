<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فريش آب — تشخيص</title>
<script src="firebase-sync.js"></script>
<style>
body{font-family:'Courier New',monospace;background:#042a2b;color:#c7d78f;padding:20px;font-size:.82rem;}
h2{color:#fff;margin:20px 0 10px;}
.box{background:rgba(255,255,255,.07);border-radius:8px;padding:14px;margin-bottom:12px;white-space:pre-wrap;word-break:break-all;max-height:300px;overflow-y:auto;}
.key{color:#e7dc83;font-weight:700;}
.ok{color:#1e9e5e;}.err{color:#c0392b;}.warn{color:#d4721f;}
button{background:#025253;color:#fff;border:none;border-radius:7px;padding:8px 16px;cursor:pointer;margin:4px;font-size:.82rem;}
</style>
</head>
<body>
<h2>🔍 تشخيص Firebase + بيانات فريش آب</h2>

<div>
  <button onclick="checkFirebase()">🔄 فحص Firebase</button>
  <button onclick="checkLocalStorage()">💾 فحص localStorage</button>
  <button onclick="clearAll()">🗑️ مسح كل البيانات</button>
  <button onclick="addTestData()">➕ إضافة بيانات تجريبية</button>
</div>

<h2>حالة الاتصال</h2>
<div class="box" id="status">جاري الفحص...</div>

<h2>بيانات FU_CACHE (Firebase)</h2>
<div class="box" id="cache-box">—</div>

<h2>بيانات localStorage الحقيقية</h2>
<div class="box" id="ls-box">—</div>

<h2>نتيجة التحليل</h2>
<div class="box" id="analysis">—</div>

<script>
var KEYS_MAP = {
  fu_balance:   "موازنة الفروع",
  fu_inventory: "الجرد",
  fu_entries:   "الاكسبايري",
  fu_needs:     "الاحتياجات",
  fu_goals:     "أهداف المبيعات",
  fu_prices:    "الأسعار",
  fu_nc:        "توفير الاحتياجات",
  fu_employees: "الموظفون",
};

function S(id, html) { document.getElementById(id).innerHTML = html; }

function checkFirebase() {
  var out = "";
  // Firebase sync status
  if (typeof FU_SYNC === "undefined") {
    out += '<span class="err">❌ firebase-sync.js لم يُحمَّل! تأكد من وجود الملف في نفس المجلد.</span>\n';
    S("status", out); return;
  }
  out += '<span class="ok">✅ firebase-sync.js محمّل</span>\n';
  out += 'FU_READY: <span class="' + (FU_SYNC.isReady() ? "ok" : "warn") + '">' + FU_SYNC.isReady() + '</span>\n';

  var cache = FU_SYNC.getCache();
  var cacheKeys = Object.keys(cache);
  out += 'مفاتيح FU_CACHE: <span class="key">' + cacheKeys.length + '</span> مفتاح\n';
  cacheKeys.forEach(function(k) {
    var val = cache[k];
    var label = KEYS_MAP[k] || k;
    var parsed = null;
    try { parsed = JSON.parse(val); } catch(e) {}
    var count = Array.isArray(parsed) ? parsed.length + " سجل" : (typeof parsed === "object" ? "object" : "string");
    out += '  <span class="key">' + k + '</span> (' + label + '): <span class="ok">' + count + '</span>\n';
  });
  S("status", out);
  checkCacheDetail();
}

function checkCacheDetail() {
  if (typeof FU_SYNC === "undefined") { S("cache-box", "firebase-sync.js غير محمّل"); return; }
  var cache = FU_SYNC.getCache();
  var out = "";
  Object.keys(KEYS_MAP).forEach(function(k) {
    var val = cache[k];
    if (!val) { out += '<span class="warn">⚠️ ' + k + ' (' + KEYS_MAP[k] + '): فارغ</span>\n\n'; return; }
    var parsed = null;
    try { parsed = JSON.parse(val); } catch(e) { out += '<span class="err">❌ ' + k + ': خطأ في التحليل: ' + e + '</span>\n\n'; return; }
    if (Array.isArray(parsed)) {
      out += '<span class="ok">✅ ' + k + ' (' + KEYS_MAP[k] + '): ' + parsed.length + ' سجل</span>\n';
      if (parsed.length > 0) {
        var first = parsed[0];
        out += '  أول سجل: site="<span class="key">' + (first.site||"—") + '</span>" | region="' + (first.region||"—") + '" | date="' + (first.addedDate||"—") + '"\n';
        if (first.items) out += '  عدد العناصر: ' + first.items.length + '\n';
      }
      out += '\n';
    } else {
      out += '<span class="ok">✅ ' + k + ': object</span>\n\n';
    }
  });
  S("cache-box", out || "لا توجد بيانات في FU_CACHE");
}

function checkLocalStorage() {
  var realLS = window._realLS || window.localStorage;
  var out = "";
  var KEYS = ["fu_balance","fu_inventory","fu_entries","fu_needs","fu_goals","fu_prices","fu_nc","fu_employees"];
  KEYS.forEach(function(k) {
    var val = realLS.getItem(k);
    if (!val) { out += '<span class="warn">⚠️ ' + k + ': فارغ في localStorage الحقيقي</span>\n\n'; return; }
    try {
      var parsed = JSON.parse(val);
      if (Array.isArray(parsed)) {
        out += '<span class="ok">✅ ' + k + ': ' + parsed.length + ' سجل في localStorage</span>\n';
        if (parsed[0]) out += '  site="' + (parsed[0].site||"—") + '" date="' + (parsed[0].addedDate||"—") + '"\n';
      } else {
        out += '<span class="ok">✅ ' + k + ': object</span>\n';
      }
    } catch(e) {
      out += '<span class="err">❌ ' + k + ': ' + e + '</span>\n';
    }
    out += '\n';
  });
  S("ls-box", out || "localStorage الحقيقي فارغ تماماً");
}

function analyze() {
  var out = "";
  var cache = (typeof FU_SYNC !== "undefined") ? FU_SYNC.getCache() : {};

  // Check: does fu_entries exist?
  var expiry = null, inv = null, needs = null, bal = null;
  try { expiry = JSON.parse(cache["fu_entries"]||"null"); } catch(e) {}
  try { inv    = JSON.parse(cache["fu_inventory"]||"null"); } catch(e) {}
  try { needs  = JSON.parse(cache["fu_needs"]||"null"); } catch(e) {}
  try { bal    = JSON.parse(cache["fu_balance"]||"null"); } catch(e) {}

  var BR_Q = ["فرع التربية - القصيم","فرع عنيزة - القصيم","فرع الرس - القصيم","فرع اتمال - القصيم","ماكينة 121","ماكينة 153","ماكينة 143","ماكينة 129","ماكينة 149","ماكينة 145"];
  var BR_R = ["فرع الزكاة - الرياض","CCC 127","CCC 146","CCC 150","MUN 124","MUN 126","MUN 140","Red Sea 272","Red Sea 123","SLC 144","SLC 128","EJADA 130","TNFZ 141","ELM 142"];

  [["fu_entries (اكسبايري)", expiry], ["fu_inventory (جرد)", inv], ["fu_needs (احتياجات)", needs], ["fu_balance (موازنة)", bal]].forEach(function(pair) {
    var name = pair[0], data = pair[1];
    if (!data || !data.length) { out += '<span class="warn">⚠️ ' + name + ': لا بيانات في Firebase</span>\n'; return; }
    out += '<span class="ok">✅ ' + name + ': ' + data.length + ' سجل</span>\n';
    data.forEach(function(r) {
      var inR = BR_R.includes(r.site);
      var inQ = BR_Q.includes(r.site);
      var regionStatus = inR ? '<span class="ok">في الرياض</span>' : inQ ? '<span class="ok">في القصيم</span>' : '<span class="err">⚠️ SITE غير معروف!</span>';
      out += '   site="<span class="key">' + (r.site||"—") + '</span>" → ' + regionStatus + '\n';
    });
    out += '\n';
  });

  if (out.includes("SITE غير معروف")) {
    out += '\n<span class="err">🔴 المشكلة: قيمة "site" في البيانات لا تطابق أسماء الفروع في النظام.</span>\n';
    out += '<span class="warn">الحل: تأكد أن بيانات الكاشير تُحفظ بنفس اسم الفرع الموجود في supervisor.html</span>\n';
  }
  S("analysis", out || "لا بيانات للتحليل");
}

// Run checks on page load
window.addEventListener("load", function() {
  setTimeout(function() {
    checkFirebase();
    checkLocalStorage();
    analyze();
  }, 2000); // انتظر 2 ثانية لتحميل Firebase
});

function clearAll() {
  if (!confirm("مسح كل البيانات نهائياً؟")) return;
  ["fu_balance","fu_inventory","fu_entries","fu_needs","fu_goals","fu_prices","fu_nc"].forEach(function(k) {
    localStorage.removeItem(k);
  });
  alert("تم المسح. أعد تحميل الصفحة.");
}

function addTestData() {
  // Add sample data to test the sync
  var testExp = JSON.stringify([{
    id: Date.now(),
    items: [{cat:"sandwich", nameAr:"بوريتو دجاج", nameEn:"Chicken Burrito", qty:2, exp:new Date().toISOString().split("T")[0]}],
    site: "فرع الزكاة - الرياض",
    region: "riyadh",
    cashier: "301",
    cashierName: "بسام",
    addedDate: new Date().toISOString().split("T")[0],
    weekKey: ""
  }]);
  localStorage.setItem("fu_entries", testExp);
  alert("✅ تم إضافة بيانات تجريبية للاكسبايري (فرع الزكاة - الرياض). افتح واجهة المشرف 801 أو المدير وتحقق.");
  setTimeout(function() { checkFirebase(); analyze(); }, 1000);
}
</script>
</body>
</html>
